<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signing you in…</title>
    <style>
        body {
            margin: 0; font-family: system-ui, -apple-system, sans-serif;
            background: #020617; color: #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .box { text-align: center; }
        .spinner {
            width: 48px; height: 48px; margin: 0 auto 20px;
            border: 4px solid rgba(34,211,238,0.2);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <p>Signing you in, please wait…</p>
    </div>

    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        const errorDesc = params.get('error_description');

        if (errorDesc) {
            window.location.href = '/login?error=' + encodeURIComponent(errorDesc);
        } else if (!accessToken) {
            window.location.href = '/login?error=no_token';
        } else {
            fetch('/auth/session', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    window.location.href = '/login?error=' + encodeURIComponent(data.error || 'unknown');
                }
            })
            .catch(() => {
                window.location.href = '/login?error=network';
            });
        }
    </script>
</body>
</html>
