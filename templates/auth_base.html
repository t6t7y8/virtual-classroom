<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TyeSpace — Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#22d3ee',
                        secondary: '#818cf8',
                        accent: '#a78bfa',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            background-image:
                radial-gradient(ellipse 55% 40% at 15% 0%, rgba(34,211,238,0.09), transparent),
                radial-gradient(ellipse 55% 40% at 90% 100%, rgba(129,140,248,0.09), transparent);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .tech-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(34,211,238,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,211,238,0.05) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, #000 40%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .float-icon {
            position: fixed;
            color: #22d3ee;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: floaty 14s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-22px) rotate(3deg); }
        }
        .float-icon:nth-of-type(2) { animation-delay: -2s; color:#818cf8; }
        .float-icon:nth-of-type(3) { animation-delay: -4s; color:#a78bfa; }
        .float-icon:nth-of-type(4) { animation-delay: -6s; }
        .float-icon:nth-of-type(5) { animation-delay: -8s; color:#818cf8; }
        .float-icon:nth-of-type(6) { animation-delay: -10s; }
        .float-icon:nth-of-type(7) { animation-delay: -3s; }
        .float-icon:nth-of-type(8) { animation-delay: -7s; color:#a78bfa; }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 211, 238, 0.1);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #22d3ee 0%, #818cf8 100%);
        }
        .gradient-bg:hover { background: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%); }

        .text-gradient {
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .input-field {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            transition: all 0.25s;
        }
        .input-field::placeholder { color: #64748b; }
        .input-field:focus {
            outline: none;
            border-color: #22d3ee;
            background: rgba(34, 211, 238, 0.05);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        .animate-fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px);} to {opacity:1; transform:none;} }

        .glow-cyan { box-shadow: 0 10px 40px -10px rgba(34,211,238,0.6); }
        .divider { display: flex; align-items: center; gap: 1rem; color: #64748b; font-size: 0.75rem; }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148,163,184,0.2), transparent);
        }

        .google-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 0.75rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
        }
        .google-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(34,211,238,0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background layers -->
    <div class="tech-grid"></div>
    <i class="fas fa-code float-icon text-7xl" style="top:10%; left:5%;"></i>
    <i class="fas fa-atom float-icon text-7xl" style="top:22%; right:7%;"></i>
    <i class="fas fa-book float-icon text-6xl" style="bottom:14%; left:8%;"></i>
    <i class="fas fa-laptop-code float-icon text-6xl" style="bottom:10%; right:10%;"></i>
    <i class="fas fa-graduation-cap float-icon text-6xl" style="top:55%; left:3%;"></i>
    <i class="fas fa-brain float-icon text-5xl" style="top:65%; right:5%;"></i>
    <i class="fas fa-flask float-icon text-5xl" style="top:6%; left:50%;"></i>
    <i class="fas fa-chart-line float-icon text-5xl" style="bottom:6%; left:45%;"></i>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="fixed top-6 right-6 z-50 space-y-2 max-w-md">
                {% for category, message in messages %}
                    <div class="glass rounded-xl px-5 py-3 animate-fade-in shadow-2xl
                        {% if category == 'success' %}border-l-4 !border-l-emerald-400 text-emerald-200
                        {% elif category == 'danger' %}border-l-4 !border-l-rose-400 text-rose-200
                        {% elif category == 'warning' %}border-l-4 !border-l-amber-400 text-amber-200
                        {% else %}border-l-4 !border-l-cyan-400 text-cyan-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</body>
</html>
