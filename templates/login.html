{% extends "auth_base.html" %}
{% block content %}

<div class="glass max-w-5xl w-full rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-2xl animate-fade-in border border-white/10">
    
    <!-- Left Side: Branding & Visuals -->
    <div class="md:w-1/2 gradient-bg p-12 flex flex-col justify-center items-center text-center relative overflow-hidden">
        <!-- Decorative circles -->
        <div class="absolute -top-24 -left-24 w-64 h-64 bg-white/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-24 -right-24 w-64 h-64 bg-black/20 rounded-full blur-2xl"></div>
        
        <div class="relative z-10">
            <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-6 backdrop-blur-sm">
                <i class="fas fa-graduation-cap text-4xl text-white"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-4">Welcome Back!</h1>
            <p class="text-white/80 text-lg">Sign in to continue your learning journey with EduSpace.</p>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="md:w-1/2 p-10 md:p-14 flex flex-col justify-center bg-gray-900/50">
        <h2 class="text-3xl font-bold mb-2 text-white">Login</h2>
        <p class="text-gray-400 mb-8">Enter your credentials to access your account.</p>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-500"></i>
                    </div>
                    <input type="email" name="email" required placeholder="you@example.com"
                           class="input-field pl-12">
                </div>
            </div>

            <!-- Password -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-300">Password</label>
                    <a href="#" class="text-sm text-primary hover:text-secondary transition">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-500"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="input-field pl-12">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full py-4 rounded-xl gradient-bg text-white font-semibold text-lg hover:opacity-90 hover:scale-[1.02] transition transform duration-300 shadow-lg shadow-primary/30">
                <i class="fas fa-sign-in-alt mr-2"></i>Sign In
            </button>
        </form>

        <p class="text-center text-gray-400 mt-8">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-primary hover:text-secondary font-semibold transition">Sign up here</a>
        </p>
    </div>

</div>
{% endblock %}
