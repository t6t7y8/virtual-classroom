{% extends "auth_base.html" %}
{% block content %}

<div class="glass max-w-5xl w-full rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-2xl animate-fade-in relative z-10">

    <!-- Left: Visual panel -->
    <div class="md:w-1/2 p-12 flex flex-col justify-center items-center text-center relative overflow-hidden bg-gradient-to-br from-cyan-500/10 via-indigo-500/10 to-transparent">
        <div class="absolute top-0 left-0 w-72 h-72 bg-cyan-500/20 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-72 h-72 bg-indigo-500/20 rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div>

        <div class="relative z-10">
            <div class="w-20 h-20 rounded-2xl gradient-bg flex items-center justify-center mx-auto mb-6 glow-cyan">
                <i class="fas fa-graduation-cap text-4xl text-white"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-white mb-3 tracking-tight">Welcome back!</h1>
            <p class="text-slate-400 text-base max-w-xs mx-auto">Sign in to continue your learning journey on TyeSpace.</p>

            <div class="mt-10 grid grid-cols-3 gap-3 max-w-xs mx-auto">
                <div class="glass rounded-xl p-3">
                    <i class="fas fa-comments text-cyan-400 text-lg"></i>
                </div>
                <div class="glass rounded-xl p-3">
                    <i class="fas fa-tasks text-indigo-400 text-lg"></i>
                </div>
                <div class="glass rounded-xl p-3">
                    <i class="fas fa-bullhorn text-violet-400 text-lg"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Right: Login form -->
    <div class="md:w-1/2 p-10 md:p-14 flex flex-col justify-center bg-slate-950/40">
        <h2 class="text-3xl font-bold mb-2 text-white">Login</h2>
        <p class="text-slate-400 mb-8 text-sm">Enter your credentials to access your account.</p>

        <!-- Google Button -->
        <a href="{{ url_for('auth_google') }}" class="google-btn">
            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16.1 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.6 2.4-7.2 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C40.9 35.6 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/>
            </svg>
            Continue with Google
        </a>

        <div class="divider my-6">OR CONTINUE WITH EMAIL</div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-slate-500"></i>
                    </div>
                    <input type="email" name="email" required placeholder="you@example.com" class="input-field pl-12">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-slate-300">Password</label>
                    <a href="#" class="text-xs text-cyan-400 hover:text-indigo-400 transition">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-slate-500"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••" class="input-field pl-12">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3.5 rounded-xl gradient-bg text-white font-semibold text-base hover:scale-[1.01] transition transform duration-300 glow-cyan">
                <i class="fas fa-arrow-right-to-bracket mr-2"></i>Sign In
            </button>
        </form>

        <p class="text-center text-slate-400 mt-8 text-sm">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="text-cyan-400 hover:text-indigo-400 font-semibold transition">Sign up here</a>
        </p>
    </div>

</div>
{% endblock %}
